name: Wave 1 Identity Security CI

on:
  pull_request:
    paths:
      - 'server/**'
      - 'web/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/wave1-ci.yml'
  push:
    branches:
      - 'chat-a/wave1-identity-security'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests
        run: npm test
      - name: Start sandbox server
        env:
          KDN_ENV: sandbox
          PORT: 3000
        run: |
          node server/index.mjs > /tmp/kdn-wave1.log 2>&1 &
          echo $! > /tmp/kdn-wave1.pid
          sleep 2
      - name: Health smoke tests
        run: |
          curl --fail --silent http://127.0.0.1:3000/api/v1/live | grep '"environment":"sandbox"'
          curl --fail --silent http://127.0.0.1:3000/api/v1/ready | grep '"storage":"ephemeral-memory"'
          test "$(curl --silent -o /tmp/notfound -w '%{http_code}' http://127.0.0.1:3000/private-does-not-exist)" = "404"
      - name: Ensure live guard fails closed
        run: |
          if KDN_ENV=live PORT=3999 node server/index.mjs >/tmp/live-guard.log 2>&1; then
            echo 'ERROR: live guard unexpectedly allowed startup'
            exit 1
          fi
